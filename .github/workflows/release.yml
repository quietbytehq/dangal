name: Build and release

# Push a tag like v0.1.0 to build Linux + Windows and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: apt-get update && apt-get install -y zip

      - name: Put export templates where Godot looks for them
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import assets
        run: godot --headless --import || true

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/NeonKnuckle.x86_64

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/NeonKnuckle.exe

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          cp LICENSE NOTICE README.md build/linux/ && cp LICENSE NOTICE README.md build/windows/
          (cd build/linux && zip -r "../../NeonKnuckle-${VER}-linux-x86_64.zip" .)
          (cd build/windows && zip -r "../../NeonKnuckle-${VER}-windows-x86_64.zip" .)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neon-knuckle-builds
          path: NeonKnuckle-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NeonKnuckle-*.zip
          generate_release_notes: true
