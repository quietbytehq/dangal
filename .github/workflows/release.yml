name: Build and release

# Push a tag like v0.1.0 to build Linux + Windows and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the builds to (e.g. v0.1.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: apt-get update && apt-get install -y zip

      - name: Put export templates where Godot looks for them
        run: |
          godot --version
          SRC=/root/.local/share/godot/export_templates
          ls "$SRC"
          if [ "$HOME" != "/root" ]; then
            mkdir -p "$HOME/.local/share/godot"
            cp -r "$SRC" "$HOME/.local/share/godot/"
          fi
          ls "$HOME/.local/share/godot/export_templates"

      - name: Import assets and check scripts
        run: |
          godot --headless --import 2>&1 | tee import.log || true
          # load every script through the real engine and fail on any script error
          godot --headless --quit-after 3 2>&1 | tee run.log || true
          if grep -h "SCRIPT ERROR" import.log run.log; then
            echo "::error::GDScript errors found"; exit 1
          fi

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/NeonKnuckle.x86_64

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/NeonKnuckle.exe

      - name: Package
        run: |
          VER="${{ github.event.inputs.tag || github.ref_name }}"
          cp LICENSE NOTICE README.md build/linux/ && cp LICENSE NOTICE README.md build/windows/
          (cd build/linux && zip -r "../../NeonKnuckle-${VER}-linux-x86_64.zip" .)
          (cd build/windows && zip -r "../../NeonKnuckle-${VER}-windows-x86_64.zip" .)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neon-knuckle-builds
          path: NeonKnuckle-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: NeonKnuckle-*.zip
