name: Build and release

# Push a tag like v0.1.0 to build the Linux AppImage + .deb and the Windows installer
# and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the builds to (e.g. v0.1.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: apt-get update && apt-get install -y zip

      - name: Put export templates where Godot looks for them
        run: |
          godot --version
          SRC=/root/.local/share/godot/export_templates
          ls "$SRC"
          if [ "$HOME" != "/root" ]; then
            mkdir -p "$HOME/.local/share/godot"
            cp -r "$SRC" "$HOME/.local/share/godot/"
          fi
          ls "$HOME/.local/share/godot/export_templates"

      - name: Import assets and check scripts
        run: |
          godot --headless --import 2>&1 | tee import.log || true
          # load every script through the real engine and fail on any script error
          godot --headless --quit-after 3 2>&1 | tee run.log || true
          # play CPU vs CPU on every stage for a few seconds (see main.gd _smoke_test)
          timeout 120 godot --headless -- --smoke 2>&1 | tee smoke.log || true
          if grep -h "SCRIPT ERROR" import.log run.log smoke.log; then
            echo "::error::GDScript errors found"; exit 1
          fi
          grep -q "SMOKE PASSED" smoke.log || { echo "::error::smoke test did not finish"; exit 1; }

      - name: Screenshot tour (for review)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag == ''
        continue-on-error: true
        run: |
          apt-get install -y xvfb xauth libgl1-mesa-dri libgl1 libglx-mesa0 libegl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libxext6 libxrender1 libx11-6 libxfixes3 >/dev/null
          mkdir -p shots
          timeout 240 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --rendering-driver opengl3 --audio-driver Dummy --resolution 1280x720 -- --shots "$PWD/shots" 2>&1 | tail -20
          ls shots | head -50
          # contact sheets printed into the log (artifact downloads may be blocked for reviewers)
          apt-get install -y imagemagick >/dev/null
          ls shots/*.png | head -16 > /tmp/a.txt; ls shots/*.png | tail -n +17 > /tmp/b.txt
          for part in a b; do
            [ -s /tmp/$part.txt ] || continue
            montage $(cat /tmp/$part.txt) -tile 4x -geometry 440x248+2+2 -background black -quality 68 sheet_$part.jpg
            echo "SHEET_BEGIN_$part"; base64 -w 2000 sheet_$part.jpg; echo "SHEET_END_$part"
          done

      - name: Upload screenshots
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag == ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/Dangal.x86_64

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/Dangal.exe

      - name: Install packaging tools
        run: apt-get install -y nsis curl file

      - name: Build packages (AppImage, .deb, Windows installer)
        run: |
          # version from project.godot, e.g. 0.3.0
          VER=$(grep -oP 'config/version="\K[^"]+' project.godot)
          cp LICENSE NOTICE README.md build/linux/ && cp LICENSE NOTICE README.md build/windows/
          bash packaging/build_packages.sh "$VER" "$PWD/dist"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: dangal-linux
          path: |
            dist/*.AppImage
            dist/*.deb

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: dangal-windows
          path: dist/*-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*-Setup.exe
